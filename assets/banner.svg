<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">Moosa Alam</title>
  <desc id="d">Profile banner for Moosa Alam, Computer Science Co-op at University of Guelph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="orb" cx="82%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fine" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#orb)"/>
  <rect width="1200" height="280" fill="url(#fine)"/>

  <rect x="0" y="0" width="1200" height="1" fill="#1E293B"/>
  <rect x="0" y="279" width="1200" height="1" fill="#1E293B"/>

  <text x="72" y="88" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#64748B" letter-spacing="4">UNIVERSITY OF GUELPH  |  CS CO-OP</text>

  <text x="72" y="158" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700" fill="url(#name)" letter-spacing="1">Moosa Alam</text>

  <rect x="72" y="180" width="120" height="2" fill="url(#glow)"/>

  <text x="72" y="218" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#94A3B8">Systems, security, infrastructure, and applied AI.</text>
  <text x="72" y="246" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#64748B">Open to Winter 2027 co-op</text>

  <g transform="translate(980, 70)" opacity="0.9">
    <circle cx="70" cy="70" r="68" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="70" cy="70" r="48" fill="none" stroke="#334155" stroke-width="1"/>
    <circle cx="70" cy="70" r="28" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="4" fill="#38BDF8"/>
    <line x1="70" y1="2" x2="70" y2="22" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="70" y1="118" x2="70" y2="138" stroke="#64748B" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="2" y1="70" x2="22" y2="70" stroke="#64748B" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="118" y1="70" x2="138" y2="70" stroke="#64748B" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>