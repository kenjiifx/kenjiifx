<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="mt md">
  <title id="mt">Capability matrix</title>
  <desc id="md">Engineering capabilities across systems, security, infrastructure, and product delivery.</desc>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" rx="10" fill="url(#mbg)" stroke="#1E293B"/>
  <text x="36" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B" letter-spacing="2.5">CAPABILITY MATRIX</text>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
    <rect x="36" y="70" width="290" height="230" rx="8" fill="#0A1220" stroke="#1E293B"/>
    <text x="56" y="108" font-size="16" font-weight="700" fill="#22D3EE">Systems</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#CBD5E1">
      <text x="56" y="144">Rust · C · Win32</text>
      <text x="56" y="172">wgpu · WGSL</text>
      <text x="56" y="200">sockets · pthreads</text>
      <text x="56" y="228">Linux · concurrency</text>
      <text x="56" y="256">native runtimes</text>
    </g>

    <rect x="342" y="70" width="290" height="230" rx="8" fill="#0A1220" stroke="#1E293B"/>
    <text x="362" y="108" font-size="16" font-weight="700" fill="#A5B4FC">Security</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#CBD5E1">
      <text x="362" y="144">IAM · least privilege</text>
      <text x="362" y="172">policy enforcement</text>
      <text x="362" y="200">runtime guardrails</text>
      <text x="362" y="228">threat telemetry</text>
      <text x="362" y="256">anomaly detection</text>
    </g>

    <rect x="648" y="70" width="290" height="230" rx="8" fill="#0A1220" stroke="#1E293B"/>
    <text x="668" y="108" font-size="16" font-weight="700" fill="#22D3EE">Infrastructure</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#CBD5E1">
      <text x="668" y="144">AWS · Docker</text>
      <text x="668" y="172">PostgreSQL</text>
      <text x="668" y="200">Prometheus · Grafana</text>
      <text x="668" y="228">GitHub Actions</text>
      <text x="668" y="256">logging · monitoring</text>
    </g>

    <rect x="954" y="70" width="290" height="230" rx="8" fill="#0A1220" stroke="#1E293B"/>
    <text x="974" y="108" font-size="16" font-weight="700" fill="#A5B4FC">Product</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#CBD5E1">
      <text x="974" y="144">TypeScript · Next.js</text>
      <text x="974" y="172">React · Node.js</text>
      <text x="974" y="200">FastAPI · Firebase</text>
      <text x="974" y="228">API design</text>
      <text x="974" y="256">full-stack delivery</text>
    </g>
  </g>
</svg>