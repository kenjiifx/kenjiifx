<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="ft fd">
  <title id="ft">SENSEFORGE architecture</title>
  <desc id="fd">Native Windows perceptual runtime pipeline: SenseGenome to PerceptualCompiler to PerceptualRuntime to wgpu WGSL to Win32 overlay.</desc>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1280" height="420" rx="10" fill="url(#fbg)" stroke="#1E293B"/>
  <rect x="0" y="0" width="5" height="420" rx="2" fill="url(#edge)"/>

  <text x="36" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B" letter-spacing="2.5">FLAGSHIP SYSTEM</text>
  <text x="36" y="84" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC">SENSEFORGE</text>
  <text x="36" y="116" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15" fill="#94A3B8">Native Windows perceptual-computing runtime</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <rect x="900" y="48" width="84" height="28" rx="6" fill="#0B1524" stroke="#164E63"/>
    <text x="942" y="67" text-anchor="middle" fill="#22D3EE">Rust</text>
    <rect x="994" y="48" width="84" height="28" rx="6" fill="#0B1524" stroke="#164E63"/>
    <text x="1036" y="67" text-anchor="middle" fill="#22D3EE">wgpu</text>
    <rect x="1088" y="48" width="70" height="28" rx="6" fill="#0B1524" stroke="#312E81"/>
    <text x="1123" y="67" text-anchor="middle" fill="#A5B4FC">WGSL</text>
    <rect x="1168" y="48" width="72" height="28" rx="6" fill="#0B1524" stroke="#312E81"/>
    <text x="1204" y="67" text-anchor="middle" fill="#A5B4FC">Win32</text>
  </g>

  <!-- pipeline nodes -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
    <rect x="36" y="160" width="210" height="100" rx="8" fill="#0A1220" stroke="#1E293B"/>
    <text x="52" y="192" font-size="12" fill="#64748B">01</text>
    <text x="52" y="220" font-size="18" font-weight="700" fill="#F8FAFC">SenseGenome</text>
    <text x="52" y="244" font-size="12" fill="#94A3B8">latent sensory state</text>

    <rect x="286" y="160" width="210" height="100" rx="8" fill="#0A1220" stroke="#1E293B"/>
    <text x="302" y="192" font-size="12" fill="#64748B">02</text>
    <text x="302" y="220" font-size="18" font-weight="700" fill="#F8FAFC">Compiler</text>
    <text x="302" y="244" font-size="12" fill="#94A3B8">PerceptualCompiler</text>

    <rect x="536" y="160" width="210" height="100" rx="8" fill="#0A1220" stroke="#1E293B"/>
    <text x="552" y="192" font-size="12" fill="#64748B">03</text>
    <text x="552" y="220" font-size="18" font-weight="700" fill="#F8FAFC">Runtime</text>
    <text x="552" y="244" font-size="12" fill="#94A3B8">PerceptualRuntime</text>

    <rect x="786" y="160" width="210" height="100" rx="8" fill="#0A1220" stroke="#164E63"/>
    <text x="802" y="192" font-size="12" fill="#22D3EE">04</text>
    <text x="802" y="220" font-size="18" font-weight="700" fill="#F8FAFC">GPU Pipeline</text>
    <text x="802" y="244" font-size="12" fill="#94A3B8">wgpu + WGSL fields</text>

    <rect x="1036" y="160" width="204" height="100" rx="8" fill="#0A1220" stroke="#312E81"/>
    <text x="1052" y="192" font-size="12" fill="#A5B4FC">05</text>
    <text x="1052" y="220" font-size="18" font-weight="700" fill="#F8FAFC">Win32 Overlay</text>
    <text x="1052" y="244" font-size="12" fill="#94A3B8">click-through surface</text>
  </g>

  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="246" y1="210" x2="278" y2="210"/>
    <line x1="496" y1="210" x2="528" y2="210"/>
    <line x1="746" y1="210" x2="778" y2="210"/>
    <line x1="996" y1="210" x2="1028" y2="210"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="36" y="320" fill="#64748B">ENGINEERING SURFACE</text>
    <text x="36" y="350" fill="#CBD5E1">transparent overlays  ·  uniform alignment  ·  shader pipelines  ·  native window behaviour  ·  real-time render loops</text>
    <text x="36" y="380" fill="#64748B">Not a demo wrapper. OS-level behaviour meeting GPU execution.</text>
  </g>
</svg>