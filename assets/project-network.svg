<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Engineering Map - Project Direction Groups</title>
  <desc id="mapDesc">Architecture-style map grouping Moosa Alam projects by systems, security, infrastructure, applied AI, and foundations. Visual groupings only - not a dependency graph.</desc>
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0A1024"/>
    </linearGradient>
    <pattern id="mapGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" rx="8" fill="url(#mapBg)"/>
  <rect width="1200" height="640" rx="8" fill="url(#mapGrid)"/>
  <rect x="1" y="1" width="1198" height="638" rx="8" fill="none" stroke="#1E293B"/>

  <text x="40" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B" letter-spacing="2">ENGINEERING MAP</text>
  <text x="40" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">Unified direction across layers</text>
  <text x="40" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">Visual groupings by domain - not technical dependency edges</text>

  <g transform="translate(40, 120)">
    <rect width="360" height="220" rx="8" fill="#080D1C" stroke="#0EA5E9" stroke-opacity="0.45"/>
    <rect x="0" y="0" width="360" height="36" rx="8" fill="#0B1A2E"/>
    <rect x="0" y="28" width="360" height="8" fill="#0B1A2E"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#38BDF8" letter-spacing="1.5">SYSTEMS | GPU | WINDOWS</text>

    <text x="16" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">SENSEFORGE</text>
    <text x="16" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">flagship native runtime</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">
      <circle cx="22" cy="120" r="3" fill="#38BDF8"/>
      <text x="34" y="124">native runtime</text>
      <circle cx="22" cy="146" r="3" fill="#38BDF8"/>
      <text x="34" y="150">GPU pipeline | WGSL</text>
      <circle cx="22" cy="172" r="3" fill="#38BDF8"/>
      <text x="34" y="176">Windows systems | Win32</text>
      <circle cx="22" cy="198" r="3" fill="#0EA5E9"/>
      <text x="34" y="202">perceptual state compilation</text>
    </g>
  </g>

  <g transform="translate(420, 120)">
    <rect width="360" height="220" rx="8" fill="#080D1C" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <rect x="0" y="0" width="360" height="36" rx="8" fill="#140F28"/>
    <rect x="0" y="28" width="360" height="8" fill="#140F28"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#A78BFA" letter-spacing="1.5">SECURITY | POLICY</text>

    <text x="16" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Permission-Guard</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">
      <text x="16" y="88">IAM analysis -&gt; least privilege</text>
    </g>

    <line x1="16" y1="104" x2="344" y2="104" stroke="#1E293B"/>

    <text x="16" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Agent-Seatbelt</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">
      <text x="16" y="152">policy engine -&gt; execution controls</text>
    </g>

    <line x1="16" y1="168" x2="344" y2="168" stroke="#1E293B"/>

    <text x="16" y="196" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">Distributed SSH Threat Monitor</text>
    <text x="16" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">auth telemetry -&gt; anomaly signals</text>
  </g>

  <g transform="translate(800, 120)">
    <rect width="360" height="220" rx="8" fill="#080D1C" stroke="#0EA5E9" stroke-opacity="0.35"/>
    <rect x="0" y="0" width="360" height="36" rx="8" fill="#0B1A2E"/>
    <rect x="0" y="28" width="360" height="8" fill="#0B1A2E"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#38BDF8" letter-spacing="1.5">INFRA | OBSERVABILITY</text>

    <text x="16" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Threat Detection Pipeline</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">
      <circle cx="22" cy="104" r="3" fill="#38BDF8"/>
      <text x="34" y="108">telemetry ingestion</text>
      <circle cx="22" cy="132" r="3" fill="#38BDF8"/>
      <text x="34" y="136">detection logic</text>
      <circle cx="22" cy="160" r="3" fill="#A78BFA"/>
      <text x="34" y="164">PostgreSQL | Prometheus | Grafana</text>
      <circle cx="22" cy="188" r="3" fill="#A78BFA"/>
      <text x="34" y="192">Dockerized observability path</text>
    </g>
  </g>

  <g transform="translate(40, 360)">
    <rect width="560" height="240" rx="8" fill="#080D1C" stroke="#8B5CF6" stroke-opacity="0.35"/>
    <rect x="0" y="0" width="560" height="36" rx="8" fill="#140F28"/>
    <rect x="0" y="28" width="560" height="8" fill="#140F28"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#A78BFA" letter-spacing="1.5">APPLIED AI | PRODUCT DELIVERY</text>

    <text x="16" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">VITAL</text>
    <text x="16" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">AI-assisted health interface | hackathon | 4th overall</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">
      <circle cx="22" cy="128" r="3" fill="#A78BFA"/>
      <text x="34" y="132">applied AI workflows | Gemini</text>
      <circle cx="22" cy="154" r="3" fill="#A78BFA"/>
      <text x="34" y="158">Next.js | TypeScript | Firebase</text>
      <circle cx="22" cy="180" r="3" fill="#38BDF8"/>
      <text x="34" y="184">end-to-end product delivery under time pressure</text>
      <circle cx="22" cy="206" r="3" fill="#38BDF8"/>
      <text x="34" y="210">evidence of polished shipping with a team</text>
    </g>
  </g>

  <g transform="translate(620, 360)">
    <rect width="540" height="240" rx="8" fill="#080D1C" stroke="#334155" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="540" height="36" rx="8" fill="#0D121F"/>
    <rect x="0" y="28" width="540" height="8" fill="#0D121F"/>
    <text x="16" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8" letter-spacing="1.5">FOUNDATIONS | NETWORKING</text>

    <text x="16" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Multithreaded HTTP Server</text>
    <text x="16" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">systems programming fundamentals in C</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">
      <circle cx="22" cy="128" r="3" fill="#94A3B8"/>
      <text x="34" y="132">POSIX sockets | HTTP</text>
      <circle cx="22" cy="154" r="3" fill="#94A3B8"/>
      <text x="34" y="158">pthreads | concurrency</text>
      <circle cx="22" cy="180" r="3" fill="#94A3B8"/>
      <text x="34" y="184">synchronization primitives</text>
      <circle cx="22" cy="206" r="3" fill="#38BDF8"/>
      <text x="34" y="210">layer beneath the framework stack</text>
    </g>
  </g>
</svg>
