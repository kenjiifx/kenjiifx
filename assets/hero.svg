    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.55"/>
