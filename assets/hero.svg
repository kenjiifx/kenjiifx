<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Moosa Alam - Systems / Security / AI Infrastructure</title>
  <desc id="heroDesc">GitHub profile hero banner for Moosa Alam, Computer Science Co-op at University of Guelph. Build target Winter 2027. Location Ontario, Canada.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#0A1228"/>
      <stop offset="100%" stop-color="#0B0F24"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#8B5CF6" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <ellipse cx="180" cy="160" rx="280" ry="160" fill="#0EA5E9" fill-opacity="0.07"/>
    <ellipse cx="980" cy="80" rx="320" ry="140" fill="#8B5CF6" fill-opacity="0.09"/>
    <ellipse cx="700" cy="280" rx="260" ry="100" fill="#38BDF8" fill-opacity="0.05"/>

    <rect x="0" y="0" width="1200" height="2" fill="url(#cyanGlow)"/>
    <rect x="0" y="318" width="1200" height="2" fill="url(#cyanGlow)"/>

    <g stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.5" fill="none">
      <path d="M 24 48 L 24 24 L 48 24"/>
      <path d="M 1152 24 L 1176 24 L 1176 48"/>
      <path d="M 24 272 L 24 296 L 48 296"/>
      <path d="M 1152 296 L 1176 296 L 1176 272"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">
      <circle cx="48" cy="72" r="3.5" fill="#22C55E">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="60" y="76" fill="#22C55E" letter-spacing="1.5">SYSTEMS ONLINE</text>
      <text x="48" y="100" letter-spacing="1">BUILD TARGET: WINTER 2027</text>
      <text x="48" y="120" letter-spacing="1">LOCATION: ONTARIO, CANADA</text>
      <text x="48" y="140" letter-spacing="1">MODE: BUILD / TEST / SHIP</text>
    </g>

    <text x="48" y="198" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700" fill="url(#titleGrad)" letter-spacing="4">MOOSA ALAM</text>
    <text x="48" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#38BDF8" letter-spacing="3.5">SYSTEMS  /  SECURITY  /  AI INFRASTRUCTURE</text>

    <g transform="translate(780, 56)">
      <rect x="0" y="0" width="360" height="208" rx="6" fill="#050816" fill-opacity="0.65" stroke="#1E293B" stroke-width="1"/>
      <rect x="0" y="0" width="360" height="28" rx="6" fill="#0B1220"/>
      <rect x="0" y="22" width="360" height="6" fill="#0B1220"/>
      <circle cx="18" cy="14" r="4" fill="#334155"/>
      <circle cx="34" cy="14" r="4" fill="#334155"/>
      <circle cx="50" cy="14" r="4" fill="#334155"/>
      <text x="70" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#64748B" letter-spacing="1">kenjiifx@ops ~ profile</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
        <text x="20" y="54" fill="#64748B">$</text>
        <text x="36" y="54" fill="#94A3B8"> whoami</text>
        <text x="20" y="76" fill="#F8FAFC">Moosa Alam | CS Co-op | UGuelph</text>
        <text x="20" y="104" fill="#64748B">$</text>
        <text x="36" y="104" fill="#94A3B8"> focus --primary</text>
        <text x="20" y="126" fill="#38BDF8">systems | security | infrastructure</text>
        <text x="20" y="154" fill="#64748B">$</text>
        <text x="36" y="154" fill="#94A3B8"> status --coop</text>
        <text x="20" y="176" fill="#A78BFA">seeking Winter 2027 engineering roles</text>
      </g>
      <rect id="cursor" x="20" y="188" width="8" height="14" fill="#22C55E">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0" y="0" width="1200" height="40" fill="url(#scanGrad)" opacity="0.8">
      <animate attributeName="y" values="-40;320" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
