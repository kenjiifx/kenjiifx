<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="ht hd">
  <title id="ht">Moosa Alam</title>
  <desc id="hd">Systems, security, and infrastructure engineer. University of Guelph CS Co-op. Winter 2027.</desc>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="45%" stop-color="#0A101C"/>
      <stop offset="100%" stop-color="#0F172A"/>
