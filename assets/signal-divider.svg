<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" role="img" aria-labelledby="divTitle divDesc">
  <title id="divTitle">Signal divider</title>
  <desc id="divDesc">Decorative cyan and violet signal divider for Moosa Alam GitHub profile.</desc>
  <defs>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050816" stop-opacity="0"/>
      <stop offset="18%" stop-color="#0EA5E9" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F8FAFC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="48" fill="#050816" fill-opacity="0"/>
  <line x1="40" y1="24" x2="1160" y2="24" stroke="url(#sig)" stroke-width="1"/>
  <circle cx="600" cy="24" r="3.5" fill="#38BDF8" fill-opacity="0.9"/>
  <circle cx="600" cy="24" r="8" fill="none" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="520" y="22" width="160" height="4" fill="url(#pulse)" opacity="0.7">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <g fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">
    <text x="80" y="18">KENJIIFX</text>
    <text x="1040" y="18" text-anchor="end">END TRANSMISSION</text>
  </g>
</svg>
